name: Backup completo de todas as tabelas

# Backup de TODAS as tabelas do Supabase (não só dados_app) — full semanal +
# incrementais de 6 em 6h, publicados como Releases do repositório privado de
# backups. Ver scripts/backup-completo.js e BACKUP.md.
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'auto | full | incremental'
        required: false
        default: 'auto'

jobs:
  backup-completo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout do repositório do site
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rodar backup completo
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          MODO: ${{ github.event.inputs.modo || 'auto' }}
        run: node scripts/backup-completo.js
