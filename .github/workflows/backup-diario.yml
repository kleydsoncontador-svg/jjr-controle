name: Backup diário do banco de dados

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 03:00 no horário de Brasília (UTC-3)
  workflow_dispatch: {}    # também dá pra rodar manualmente pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório do site
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependência do Supabase
        run: npm install @supabase/supabase-js --no-save

      - name: Checkout do repositório privado de backups
        uses: actions/checkout@v4
        with:
          repository: kleydsoncontador-svg/jjr-controle-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backups-repo

      - name: Rodar backup
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_DEST_DIR: ${{ github.workspace }}/backups-repo
        run: node scripts/backup-diario.js

      - name: Commitar e enviar backup pro repositório privado
        working-directory: backups-repo
        run: |
          git config user.name "Backup automático JJR"
          git config user.email "backup@jjr-controle.local"
          git add .
          git diff --staged --quiet || git commit -m "Backup automático $(date -u +%Y-%m-%d)"
          git push
