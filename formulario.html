<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Esclarecimento de lançamentos</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#16202e;--mut:#5b6778;--line:#d5dbe6;--acc:#1f4e9c;--accink:#fff;--ok:#157347;--warn:#a15c00;--field:#fff;--dis:#eef1f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#18202b;--ink:#e7ecf4;--mut:#9aa7ba;--line:#2c384a;--acc:#5b92e8;--accink:#0b1220;--ok:#4cc38a;--warn:#e0a04a;--field:#111823;--dis:#1d2735}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 12px}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .prog{flex:1;min-width:160px;color:var(--mut);font-size:.9rem}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.feito{border-color:var(--ok)}
.cab{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.cab b{font-size:1.02rem}
.tag{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.hist{color:var(--mut);font-size:.88rem;margin:4px 0 10px;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:3px}
input[type=text]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
input[type=text]:disabled{background:var(--dis);color:var(--mut)}
input:focus,button:focus{outline:2px solid var(--acc);outline-offset:1px}
.sn{display:flex;gap:8px}
.sn label{display:flex;align-items:center;gap:6px;margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);cursor:pointer;font-size:.95rem}
.sn input{margin:0}
.sn label.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cb{position:relative}
.cb .lst{display:none;position:absolute;left:0;top:100%;margin-top:2px;z-index:30;min-width:100%;width:max-content;max-width:min(92vw,600px);max-height:300px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cb .lst.open{display:block}
.cb .opt{padding:8px 12px;cursor:pointer;white-space:normal;line-height:1.3}
.cb .opt.sel,.cb .opt:hover{background:var(--acc);color:var(--accink)}
.cb .opt.extra{color:var(--warn);font-style:italic}
.msg{padding:10px 12px;border-radius:8px;margin:8px 0}
.msg.ok{background:rgba(21,115,71,.12);border:1px solid var(--ok);color:var(--ok)}
.msg.err{background:rgba(178,34,34,.1);border:1px solid #b22222;color:#b22222}
@media (max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="tit">Esclarecimento de lançamentos</h1>
  <p class="sub" id="sub">Carregando…</p>
  <div id="aviso"></div>
  <div class="bar" id="bar" style="display:none">
    <div class="prog" id="prog"></div>
    <button id="btnRasc" type="button">Salvar rascunho</button>
    <button id="btnEnv" type="button" class="pri">Enviar respostas</button>
  </div>
  <div id="lista"></div>
</div>
<script src="supabase-config.js"></script>
<script src="alerta-tipos.js"></script>
<script>
(function(){
  var qs=new URLSearchParams(location.search), TOKEN=(qs.get('t')||'').trim();
  var FORM=null, RESP={}, SUJO=false;
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var norm=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();};
  function aviso(txt,tipo){ $('aviso').innerHTML=txt?'<div class="msg '+(tipo||'ok')+'">'+esc(txt)+'</div>':''; }
  async function rpc(fn,body){
    var r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }
  var LS='paform_'+TOKEN.slice(0,16);
  function tiposPara(uso){ return (window.ALERTA_TIPOS||[]).filter(function(t){ return t.uso==='ambos'||t.uso===uso; }).map(function(t){return t.nome;}); }
  function dataBr(d){ var m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?m[3]+'/'+m[2]+'/'+m[1]:String(d||''); }

  function card(l){
    var r=RESP[l.id]||{}, rec=(l.tipo==='recebimento'), p=l.perg||{};
    var nomeRot=rec?'Nome do cliente':'Nome do fornecedor', tipoRot=rec?'Natureza do recebimento':'Tipo de gasto';
    var h='<div class="card" data-id="'+esc(l.id)+'"><div class="cab"><b>'+esc(dataBr(l.data))+' · R$ '+esc(l.valor)+'</b><span class="tag">'+(rec?'Recebimento':(l.tipo==='pagamento'?'Pagamento':'Lançamento'))+'</span></div>';
    h+='<div class="hist">'+(l.hist?'No seu extrato: '+esc(l.hist):'')+'</div><div class="grid">';
    if(p.nf!==false){
      var sim=r.nf==='sim', nao=r.nf==='nao';
      h+='<div class="full"><label>Tem nota fiscal relacionada?</label><div class="sn"><label class="'+(sim?'on':'')+'"><input type="radio" name="nf_'+esc(l.id)+'" value="sim" '+(sim?'checked':'')+'> Sim</label><label class="'+(nao?'on':'')+'"><input type="radio" name="nf_'+esc(l.id)+'" value="nao" '+(nao?'checked':'')+'> Não</label></div></div>';
      h+='<div><label>Número da nota fiscal</label><input type="text" data-k="nf_num" inputmode="numeric" '+(sim?'':'disabled')+' value="'+esc(r.nf_num||'')+'"></div>';
      h+='<div><label>Parcela (ex.: 1 de 3)</label><input type="text" data-k="parcela" '+(sim?'':'disabled')+' placeholder="1 de 1" value="'+esc(r.parcela||'')+'"></div>';
    }
    if(p.fornecedor!==false) h+='<div class="full"><label>'+nomeRot+'</label><input type="text" data-k="nome" value="'+esc(r.nome||'')+'"></div>';
    if(p.tipo!==false) h+='<div class="full"><label>'+tipoRot+' <span style="opacity:.75">(digite parte do nome e escolha na lista)</span></label><div class="cb" data-uso="'+(rec?'recebimento':'pagamento')+'"><input type="text" data-k="tipo" autocomplete="off" value="'+esc(r.tipo||'')+'"><div class="lst"></div></div></div>';
    return h+'</div></div>';
  }
  function completo(l){
    var r=RESP[l.id]||{}, p=l.perg||{};
    if(p.nf!==false){ if(!r.nf) return false; if(r.nf==='sim'&&!(r.nf_num||'').trim()) return false; }
    if(p.fornecedor!==false&&!(r.nome||'').trim()) return false;
    if(p.tipo!==false&&!(r.tipo||'').trim()) return false;
    return true;
  }
  function progresso(){
    var ls=FORM.linhas, n=ls.filter(completo).length;
    $('prog').textContent=n+' de '+ls.length+' lançamento(s) respondido(s)';
    document.querySelectorAll('.card').forEach(function(c){ var l=ls.find(function(x){return x.id===c.dataset.id;}); c.classList.toggle('feito',!!l&&completo(l)); });
  }
  function guardarLocal(){ try{ localStorage.setItem(LS,JSON.stringify(RESP)); }catch(e){} }
  function ligar(){
    $('lista').addEventListener('input',function(e){
      var t=e.target, c=t.closest('.card'); if(!c) return;
      var id=c.dataset.id; RESP[id]=RESP[id]||{};
      if(t.type==='radio'){
        RESP[id].nf=t.value;
        c.querySelectorAll('.sn label').forEach(function(lb){ lb.classList.toggle('on',lb.querySelector('input').checked); });
        var sim=t.value==='sim';
        ['nf_num','parcela'].forEach(function(k){ var i=c.querySelector('[data-k="'+k+'"]'); if(i){ i.disabled=!sim; if(!sim){ i.value=''; delete RESP[id][k]; } } });
      } else if(t.dataset.k){
        RESP[id][t.dataset.k]=t.value;
        if(t.dataset.k==='tipo'){ var n=norm(t.value), lista=tiposPara(c.querySelector('.cb').dataset.uso); RESP[id].tipo_lista=lista.some(function(x){return norm(x)===n;}); abrirLista(c.querySelector('.cb')); }
      }
      SUJO=true; guardarLocal(); progresso();
    });
    $('lista').addEventListener('focusin',function(e){ if(e.target.dataset&&e.target.dataset.k==='tipo') abrirLista(e.target.closest('.cb')); });
    $('lista').addEventListener('mousedown',function(e){
      var o=e.target.closest('.opt'); if(!o) return; e.preventDefault();
      var cb=o.closest('.cb'), c=cb.closest('.card'), id=c.dataset.id, inp=cb.querySelector('input');
      inp.value=o.dataset.v; RESP[id]=RESP[id]||{}; RESP[id].tipo=o.dataset.v; RESP[id].tipo_lista=!o.classList.contains('extra');
      fecharListas(); SUJO=true; guardarLocal(); progresso();
    });
    document.addEventListener('mousedown',function(e){ if(!e.target.closest('.cb')) fecharListas(); });
    $('lista').addEventListener('keydown',function(e){
      var cb=e.target.closest&&e.target.closest('.cb'); if(!cb) return;
      var lst=cb.querySelector('.lst'); if(!lst.classList.contains('open')) return;
      var ops=[].slice.call(lst.querySelectorAll('.opt')), i=ops.findIndex(function(o){return o.classList.contains('sel');});
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(i>=0) ops[i].classList.remove('sel'); i=e.key==='ArrowDown'?Math.min(ops.length-1,i+1):Math.max(0,i-1); if(ops[i]){ ops[i].classList.add('sel'); ops[i].scrollIntoView({block:'nearest'}); } }
      else if(e.key==='Enter'&&i>=0){ e.preventDefault(); ops[i].dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true})); }
      else if(e.key==='Escape'){ fecharListas(); }
    });
  }
  function fecharListas(){ document.querySelectorAll('.cb .lst.open').forEach(function(l){ l.classList.remove('open'); }); }
  function abrirLista(cb){
    fecharListas();
    var inp=cb.querySelector('input'), lst=cb.querySelector('.lst'), q=norm(inp.value).split(/\s+/).filter(Boolean);
    var todos=tiposPara(cb.dataset.uso);
    var ach=todos.filter(function(n){ var nn=norm(n); return q.every(function(p){return nn.indexOf(p)>=0;}); });
    var h=ach.map(function(n){return '<div class="opt" data-v="'+esc(n)+'">'+esc(n)+'</div>';}).join('');
    var exato=todos.some(function(n){return norm(n)===norm(inp.value);});
    if(inp.value.trim()&&!exato) h+='<div class="opt extra" data-v="'+esc(inp.value.trim())+'">Não achei na lista — usar "'+esc(inp.value.trim())+'"</div>';
    if(!h) return;
    lst.innerHTML=h; lst.classList.add('open');
  }
  async function salvar(final){
    try{
      if(final){
        var faltam=FORM.linhas.filter(function(l){return !completo(l);}).length;
        if(faltam&&!confirm('Ainda há '+faltam+' lançamento(s) sem resposta completa. Enviar assim mesmo?')) return;
      }
      $('btnRasc').disabled=$('btnEnv').disabled=true;
      var ok=await rpc('pa_form_save',{p_token:TOKEN,p_respostas:RESP,p_final:!!final});
      if(!ok) throw new Error('não salvou');
      SUJO=false;
      aviso(final?'Respostas enviadas. Muito obrigado! Se precisar corrigir algo, é só alterar e enviar de novo.':'Rascunho salvo. Você pode continuar depois pelo mesmo link.','ok');
      window.scrollTo(0,0);
    }catch(e){ aviso('Não foi possível salvar agora. Verifique a internet e tente de novo.','err'); }
    $('btnRasc').disabled=$('btnEnv').disabled=false;
  }
  async function iniciar(){
    if(TOKEN.length<32){ $('sub').textContent=''; aviso('Link inválido. Peça um novo link ao seu contador.','err'); return; }
    try{ FORM=await rpc('pa_form_get',{p_token:TOKEN}); }catch(e){ $('sub').textContent=''; aviso('Não foi possível abrir o formulário. Verifique a internet e tente de novo.','err'); return; }
    if(!FORM){ $('sub').textContent=''; aviso('Este link expirou ou não existe. Peça um novo link ao seu contador.','err'); return; }
    $('tit').textContent='Esclarecimento de lançamentos — '+(FORM.empresa||'');
    $('sub').textContent='Para fechar a contabilidade, precisamos entender os lançamentos abaixo. Responda cada um e clique em “Enviar respostas”. Você pode salvar um rascunho e continuar depois.';
    RESP=FORM.respostas||{};
    try{ var loc=JSON.parse(localStorage.getItem(LS)||'null'); if(loc&&!Object.keys(RESP).length) RESP=loc; }catch(e){}
    if(FORM.enviado_em) aviso('Suas respostas já foram enviadas. Você pode ajustar e enviar novamente.','ok');
    $('lista').innerHTML=FORM.linhas.map(card).join('');
    $('bar').style.display='flex';
    $('btnRasc').onclick=function(){salvar(false);}; $('btnEnv').onclick=function(){salvar(true);};
    window.addEventListener('beforeunload',function(e){ if(SUJO){ e.preventDefault(); e.returnValue=''; } });
    ligar(); progresso();
  }
  iniciar();
})();
</script>
</body>
</html>
